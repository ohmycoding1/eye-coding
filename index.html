<style>

</style></head><body>
<header><h1>👁 눈으로 코딩</h1>
<button id=eyeB>👁 시선 추적 시작</button><button id=calB>🎯 보정</button><button id=dwB>⏱ 응시 선택 꺼짐</button><button id=micB>🎤 음성 켜기</button><span id=st>마우스·스페이스바로도 사용할 수 있어요. 시선 추적을 시작하면 눈을 0.4초 이상 감아 선택합니다.</span></header>

<script>
const $=id=>document.getElementById(id),h=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const CATS=[['start','시작','#a16207'],['flow','흐름','#c2410c'],['motion','움직임','#1d4ed8'],['look','형태','#7c3aed'],['judge','판단','#047857'],['calc','계산','#0e7490']];

const BL=[
['flag','start','hat','시작하기 버튼을 클릭했을 때'],['mdown','start','hat','마우스를 클릭했을 때'],['mup','start','hat','마우스 클릭을 해제했을 때'],['odown','start','hat','오브젝트를 클릭했을 때'],['oup','start','hat','오브젝트 클릭을 해제했을 때'],
['wait','flow','stack','{n:1}초 기다리기'],['repeat','flow','c','{n:10}번 반복하기'],['forever','flow','c','계속 반복하기'],['until','flow','c','{b}까지 반복하기'],['while','flow','c','{b}인 동안 반복하기'],['break','flow','stack','반복 중단하기'],['cont','flow','stack','이번 반복 건너뛰기'],['if','flow','c','만약 {b}라면'],['ifelse','flow','c2','만약 {b}라면'],
['dx','motion','stack','x좌표를 {n:10}만큼 바꾸기'],['dy','motion','stack','y좌표를 {n:10}만큼 바꾸기'],['goto','motion','stack','x: {n:0} y: {n:0} 위치로 이동하기'],['rot','motion','stack','방향을 {n:15}만큼 회전하기'],['setdir','motion','stack','방향을 {n:90}으로 정하기'],
['say','look','stack','{t:안녕!}을(를) 말하기'],['unsay','look','stack','말풍선 지우기'],['size','look','stack','크기를 {n:10}만큼 바꾸기'],['setsize','look','stack','크기를 {n:100}으로 정하기'],['rsize','look','stack','원래 크기로 되돌리기'],
['mclick','judge','bool','마우스를 클릭했는가?'],['oclick','judge','bool','오브젝트를 클릭했는가?'],['eq','judge','bool','{v:0} = {v:0}'],['ne','judge','bool','{v:0} ≠ {v:0}'],['gt','judge','bool','{v:0} > {v:0}'],['lt','judge','bool','{v:0} < {v:0}'],['ge','judge','bool','{v:0} ≥ {v:0}'],['le','judge','bool','{v:0} ≤ {v:0}'],['and','judge','bool','{b} 그리고 {b}'],['or','judge','bool','{b} 또는 {b}'],
['add','calc','rep','{v:0} + {v:0}'],['sub','calc','rep','{v:0} - {v:0}'],['mul','calc','rep','{v:0} x {v:0}'],['div','calc','rep','{v:0} / {v:0}']];
const AL={eq:'같다',ne:'같지않다',gt:'크다',lt:'작다',ge:'크거나같다',le:'작거나같다',and:'그리고',or:'또는',add:'더하기',sub:'빼기',mul:'곱하기',div:'나누기',goto:'이동하기',ifelse:'만약아니면'};
const norm=s=>s.toLowerCase().replace(/[\s.,!?~]/g,'');
const D={};BL.forEach(([id,cat,k,l])=>{const parts=l.split(/(\{[^}]+\})/).filter(Boolean);D[id]={id,cat,k,parts,slots:parts.filter(p=>p[0]=='{').map(p=>[p[1],p.slice(3,-1)]),key:norm(l.replace(/\{[^}]+\}/g,''))+(k=='c2'?'아니면':'')}});
let ws=[],target=null,act=null,armed=null,tab='start',gen=0;const par=new WeakMap();
const mk=id=>({id,a:D[id].slots.map(s=>s[0]=='b'?null:s[1]),body:[],body2:[]});
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
const st=m=>$('st').textContent=m;
/* ---------- 팔레트 ---------- */
function tabs(){$('tabs').innerHTML='';CATS.forEach(([id,n,c])=>{const b=h('button');b.textContent=n;b.style.background=c;b.className=id==tab?'on':'';b.onclick=()=>{tab=id;tabs();pal()};$('tabs').append(b)})}
function lab(d,ph){const f=document.createDocumentFragment();d.parts.forEach(p=>{if(p[0]=='{'){const s=h('span','ph');s.textContent=p[1]=='b'?'◇':p.slice(3,-1);f.append(s)}else f.append(p)});return f}
function pal(){const p=$('pal');p.innerHTML='';BL.filter(b=>b[1]==tab).forEach(([id])=>{const b=h('button','pb');b.style.setProperty('--c',CC[tab]);b.append(lab(D[id]));if(D[id].k=='c2'){b.append(' / 아니면')}b.onclick=()=>{armed=null;add(id)};p.append(b)})}
/* ---------- 작업 공간 ---------- */
function slotEl(b,i,drawCb){const [t]=D[b.id].slots[i],v=b.a[i];
 if(v&&typeof v=='object'){return rb(v,null,()=>{b.a[i]=t=='b'?null:'0';tidy()})}
 if(t=='b'){const s=h('span','slot sb0');s.textContent='◇';if(act&&act.b===b&&act.i==i)s.classList.add('on3');s.onclick=()=>{act={b,i};armed=null;draw()};return s}
 const inp=h('input',t=='t'?'t':'');inp.value=v;inp.inputMode=t=='n'?'decimal':'text';
 inp.oninput=()=>b.a[i]=inp.value;
 inp.onfocus=()=>{act={b,i};armed=inp;inp.classList.add('arm');inp.dataset.t=t;st('🎤 말하면 이 칸에 입력됩니다')};
 inp.onblur=()=>setTimeout(()=>inp.classList.remove('arm'),0);return inp}
/* 지금 작업 공간에 남아 있는 블록 목록(A)과 블록(B)을 모읍니다 */
function live(){const A=new Set,B=new Set,g=v=>{B.add(v);v.a.forEach(x=>x&&typeof x=='object'&&g(x))},f=a=>{A.add(a);a.forEach(b=>{g(b);if(D[b.id].k=='c'||D[b.id].k=='c2'){f(b.body);f(b.body2)}})};ws.forEach(s=>f(s.body));return{A,B}}
/* 삭제 뒤에도 추가 위치를 유지하고, 사라진 곳을 가리키면 가장 가까운 곳으로 옮깁니다 */
function tidy(arr){const{A,B}=live();if(target&&!A.has(target))target=arr&&A.has(arr)?arr:ws.length?ws[ws.length-1].body:null;if(act&&!B.has(act.b))act=null;draw()}
function del(arr,b){arr.splice(arr.indexOf(b),1);ws=ws.filter(s=>s.body.length);tidy(arr)}
const root=a=>{let p;while((p=par.get(a)))a=p;return a},elOf=new WeakMap;
function rb(b,arr,delCb){const d=D[b.id],e=h('div','blk '+d.k);e.style.setProperty('--c',CC[d.cat]);
 const row=h('div','row');let si=0;d.parts.forEach(p=>{if(p[0]=='{')row.append(slotEl(b,si++));else row.append(p)});
 const x=h('button','del');x.textContent='✕';x.onclick=ev=>{ev.stopPropagation();delCb?delCb():del(arr,b)};row.append(x);e.append(row);elOf.set(b,e);
 if(d.k=='c'||d.k=='c2'){par.set(b.body,arr);e.append(rbody(b.body,arr));if(d.k=='c2'){const r2=h('div','row');r2.textContent='아니면';par.set(b.body2,arr);e.append(r2,rbody(b.body2,arr))}}
 return e}
function rbody(a,p){const w=h('div','body');a.forEach(b=>w.append(rb(b,a)));const z=h('div','zone'+(a===target?' t':''));z.textContent=a===target?'📍 블록이 여기에 추가돼요':'＋ 여기에 추가하기';z.onclick=()=>{target=a;act=null;draw()};w.append(z);return w}
function draw(){const w=$('ws');const y=w.scrollTop;w.innerHTML='';ws.forEach(s=>{const e=h('div','script');par.set(s.body,null);if(s.body[0]&&D[s.body[0].id].k!='hat'){const n=h('div','warn');n.textContent='⚠ 시작 블록이 없어 실행되지 않아요. 이 묶음에 추가 위치를 둔 채 「시작」 블록을 고르면 맨 위에 붙어요.';e.append(n)}s.body.forEach(b=>e.append(rb(b,s.body)));const z=h('div','zone'+(s.body===target?' t':''));z.textContent=s.body===target?'📍 블록이 여기에 추가돼요':'＋ 여기에 추가하기';z.onclick=()=>{target=s.body;act=null;draw()};e.append(z);w.append(e)});
 if(!ws.length){w.innerHTML='<div style="padding:20px;opacity:.7">왼쪽에서 블록을 골라 보세요. 먼저 「시작」 블록을 고르면 좋아요.</div>'}w.scrollTop=y}
function add(id,nums){const d=D[id],b=mk(id);
 if(d.k=='bool'||d.k=='rep'){if(!act){toast('먼저 블록을 넣을 칸(◇ 또는 숫자 칸)을 선택하세요');return}
  const t=D[act.b.id].slots[act.i][0];if(d.k=='rep'&&t=='b'){toast('계산 블록은 숫자 칸에 넣을 수 있어요');return}
  act.b.a[act.i]=b;act=null;fill(b,nums);draw();return}
 if(d.k=='hat'){const r=target&&root(target),s=r&&ws.find(s=>s.body===r);if(s&&s.body[0]&&D[s.body[0].id].k!='hat')s.body.unshift(b);else{const n={body:[b]};ws.push(n);target=n.body}}else{if(!target){const s={body:[]};ws.push(s);target=s.body}target.push(b)}
 fill(b,nums);act=null;
 if(d.k=='c'||d.k=='c2'){par.set(b.body,target);par.set(b.body2,target);const bi=d.slots.findIndex(s=>s[0]=='b');if(bi>=0&&b.a[bi]===null)act={b,i:bi};target=b.body}
 draw();$('ws').scrollTop=1e9}
function fill(b,nums){if(!nums)return;let k=0;D[b.id].slots.forEach((s,i)=>{if(s[0]!='b'&&s[0]!='t'&&k<nums.length&&typeof b.a[i]!='object')b.a[i]=nums[k++]})}
$('outB').onclick=()=>{const p=target&&par.get(target);if(p){target=p;draw()}else toast('이미 가장 바깥이에요')};
$('clrB').onclick=()=>{ws=[];target=null;act=null;draw()};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const [id,d]=b.dataset.s.split(',');$(id).scrollBy(0,d*220)});
/* ---------- 실행 ---------- */
const S={x:0,y:0,dir:90,size:100,say:'',md:false,od:false},STOP={},BRK={},CNT={};
const sl=ms=>new Promise(r=>setTimeout(r,ms));
function paint(){const sp=$('spr'),l=(S.x+240)/480*100,t=(180-S.y)/360*100;sp.style.left=l+'%';sp.style.top=t+'%';sp.style.transform=`translate(-50%,-50%) rotate(${S.dir-90}deg) scale(${S.size/100})`;const b=$('bub');b.style.left=Math.min(Math.max(l,22),78)+'%';b.style.top=t+'%';b.style.display=S.say?'block':'none';b.textContent=S.say}
const nm=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
function ev(a){if(a&&typeof a=='object')return evb(a);if(a===null)return false;const n=Number(a);return a!==''&&!isNaN(n)?n:a}
function evb(b){const g=i=>ev(b.a[i]);const A=g(0),B=g(1),num=typeof A=='number'&&typeof B=='number';
 switch(b.id){case'mclick':return S.md;case'oclick':return S.od;case'eq':return num?A==B:String(A)==String(B);case'ne':return num?A!=B:String(A)!=String(B);
 case'gt':return nm(A)>nm(B);case'lt':return nm(A)<nm(B);case'ge':return nm(A)>=nm(B);case'le':return nm(A)<=nm(B);case'and':return !!A&&!!B;case'or':return !!A||!!B;
 case'add':return nm(A)+nm(B);case'sub':return nm(A)-nm(B);case'mul':return nm(A)*nm(B);case'div':return nm(B)?nm(A)/nm(B):0}}
async function ex(list,id){for(const b of list){if(id!=gen)throw STOP;await one(b,id);paint()}}
async function loop(cond,b,id){while(cond()){if(id!=gen)throw STOP;try{await ex(b.body,id)}catch(e){if(e===BRK)return;if(e!==CNT)throw e}await sl(16)}}
async function one(b,id){const g=i=>ev(b.a[i]),cx=v=>Math.max(-240,Math.min(240,v)),cy=v=>Math.max(-180,Math.min(180,v));
 switch(b.id){case'wait':await sl(nm(g(0))*1000);break;
